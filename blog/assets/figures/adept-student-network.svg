<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1235" viewBox="0 0 1400 1235" role="img" aria-labelledby="title desc">
<title id="title">ADEPT：感知 Student 的网络结构</title>
<desc id="desc">两路 RGB 经共享 ResNet 和 cross-attention 得到 256 维视觉特征，与机器人本体特征和控制器状态融合，经两层 512 维 MLP、1024 维 LSTM 后输出动作。视觉特征另接训练用八角点辅助头。Sharpa 版本额外编码五指触觉并以指尖位置进行 FiLM 调节。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172033}.bold{font-weight:700}</style>
<rect width="1400" height="1235" fill="white"/>
<text x="40" y="55" font-size="32" text-anchor="start" class="bold">ADEPT：感知 Student 的网络结构</text>
<text x="40" y="96" font-size="21" text-anchor="start">依据论文附录 H；上方为 Kuka 视觉版本，下方列出 Sharpa 触觉扩展。</text>
<rect x="24" y="130" width="1352" height="405" rx="16" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="50" y="168" font-size="25" text-anchor="start" class="bold">① 视觉与数值输入：图像特征和机器人状态共同参与决策</text>
<rect x="55" y="215" width="340" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="225.0" y="261.7" font-size="22" text-anchor="middle" class="bold">两张 RGB 图像</text>
<text x="225.0" y="293.7" font-size="22" text-anchor="middle">共享 ResNet 提取特征</text>
<rect x="470" y="215" width="400" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="670.0" y="261.55" font-size="23" text-anchor="middle" class="bold">Cross-attention 融合</text>
<text x="670.0" y="294.55" font-size="23" text-anchor="middle">256 维视觉特征</text>
<rect x="945" y="215" width="400" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="1145.0" y="246.35" font-size="21" text-anchor="middle" class="bold">8 个三维角点辅助头</text>
<text x="1145.0" y="277.35" font-size="21" text-anchor="middle">24 维预测＋仿真真值监督</text>
<text x="1145.0" y="308.35" font-size="21" text-anchor="middle">提供训练辅助损失</text>
<path d="M395 270 L470 270" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M870 270 L945 270" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="55" y="390" width="340" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="225.0" y="431.7" font-size="22" text-anchor="middle" class="bold">本体感知特征</text>
<text x="225.0" y="463.7" font-size="22" text-anchor="middle">控制器相关数值状态</text>
<rect x="470" y="390" width="400" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="670.0" y="431.55" font-size="23" text-anchor="middle" class="bold">拼接与融合</text>
<text x="670.0" y="464.55" font-size="23" text-anchor="middle">视觉＋数值状态</text>
<path d="M395 440 L470 440" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M670 325 L670 390" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1145" y="400" font-size="22" text-anchor="middle">辅助头教网络看清朝向</text>
<text x="1145" y="444" font-size="21" text-anchor="middle">部署无需输入角点真值</text>
<rect x="24" y="560" width="1352" height="280" rx="16" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="50" y="598" font-size="25" text-anchor="start" class="bold">② 控制主干：先融合当前特征，再结合近期记忆</text>
<rect x="55" y="645" width="290" height="105" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="200.0" y="689.2" font-size="22" text-anchor="middle" class="bold">融合特征</text>
<text x="200.0" y="721.2" font-size="22" text-anchor="middle">来自上方输入分支</text>
<rect x="395" y="645" width="290" height="105" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="540.0" y="688.9" font-size="24" text-anchor="middle" class="bold">两层 MLP</text>
<text x="540.0" y="722.9" font-size="24" text-anchor="middle">512 → 512</text>
<rect x="735" y="645" width="290" height="105" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="880.0" y="688.9" font-size="24" text-anchor="middle" class="bold">LSTM</text>
<text x="880.0" y="722.9" font-size="24" text-anchor="middle">1024 维记忆</text>
<rect x="1075" y="645" width="270" height="105" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="1210.0" y="689.05" font-size="23" text-anchor="middle" class="bold">动作输出头</text>
<text x="1210.0" y="722.05" font-size="23" text-anchor="middle">Kuka：23 维</text>
<path d="M345 698 L395 698" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M685 698 L735 698" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1025 698 L1075 698" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="55" y="804" font-size="22" text-anchor="start">动作交给底层控制器执行。部署权重固定，LSTM 记忆随每次前向计算更新。</text>
<rect x="24" y="865" width="1352" height="340" rx="16" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="50" y="903" font-size="25" text-anchor="start" class="bold">③ Sharpa 扩展：下方触觉支路仅用于视触觉版本</text>
<rect x="55" y="950" width="280" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="195.0" y="986.35" font-size="21" text-anchor="middle" class="bold">五指触觉输入</text>
<text x="195.0" y="1017.35" font-size="21" text-anchor="middle">每指：深度图＋接触图</text>
<text x="195.0" y="1048.35" font-size="21" text-anchor="middle">两通道</text>
<rect x="390" y="950" width="280" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="530.0" y="986.35" font-size="21" text-anchor="middle" class="bold">共享小 CNN</text>
<text x="530.0" y="1017.35" font-size="21" text-anchor="middle">每个指尖输出 32 维</text>
<text x="530.0" y="1048.35" font-size="21" text-anchor="middle">五指共用网络权重</text>
<rect x="725" y="950" width="280" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="865.0" y="986.35" font-size="21" text-anchor="middle" class="bold">指尖位置 → FiLM</text>
<text x="865.0" y="1017.35" font-size="21" text-anchor="middle">按空间位置</text>
<text x="865.0" y="1048.35" font-size="21" text-anchor="middle">调节触觉特征</text>
<rect x="1060" y="950" width="285" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="1202.5" y="986.35" font-size="21" text-anchor="middle" class="bold">160 维触觉特征</text>
<text x="1202.5" y="1017.35" font-size="21" text-anchor="middle">加入上方融合</text>
<text x="1202.5" y="1048.35" font-size="21" text-anchor="middle">动作头输出 29 维</text>
<path d="M335 1010 L390 1010" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M670 1010 L725 1010" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1005 1010 L1060 1010" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="55" y="1124" font-size="22" text-anchor="start">FiLM：利用指尖位置，对对应触觉特征做缩放与偏移。</text>
<text x="55" y="1170" font-size="21" text-anchor="start">触觉深度图采用统一表示；真实传感器输出需先经过校准与转换。</text>
</svg>