<title id="title">HORA 对照实验：改变的是哪一条信息路径</title>
<desc id="desc">六行对照Ours、DR、SysID、NoAdapt、Periodic、Expert。DR重新训练无latent分支策略；SysID替换估计目标为实际参数但其后端连接未完整公开；NoAdapt固定初始latent但保留观测反馈；Periodic回放动作；Expert使用仿真真实信息经编码器得到latent。</desc>
