<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1780" viewBox="0 0 1280 1780" role="img" aria-labelledby="title desc">
<title id="title">HORA：特权训练、历史适应与真实部署</title>
<desc id="desc">HORA第一阶段用PPO训练物体信息编码器和共享ActorCritic；第二阶段冻结编码器和策略，仅以latent均方误差训练历史适应模块，同时用预测latent运行冻结策略收集历史；部署只保留历史适应和动作策略，输出经裁剪和累积转换为PD位置目标。</desc>
<defs>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="fixed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
</defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172033} .title{font-weight:750} .muted{fill:#475569}</style>
<rect width="1280" height="1780" fill="#ffffff"/>
<text x="40" y="57" font-size="32" text-anchor="start" class="title">HORA：特权训练、历史适应与真实部署</text>
<text x="40" y="99" font-size="22" text-anchor="start" class="muted">同一条控制策略 π，训练与部署时从不同路径获得环境表征。</text>
<rect x="40" y="126" width="25" height="25" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="76" y="147" font-size="22" text-anchor="start" class="">网络／可导计算</text>
<rect x="260" y="126" width="25" height="25" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="296" y="147" font-size="22" text-anchor="start" class="">固定数据／冻结模块</text>
<rect x="585" y="126" width="25" height="25" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="621" y="147" font-size="22" text-anchor="start" class="">物理环境</text>
<rect x="795" y="126" width="25" height="25" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="831" y="147" font-size="22" text-anchor="start" class="">损失／改动</text>
<path d="M 1020 135 L 1070 135" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#grad)"/>
<text x="1083" y="143" font-size="22" text-anchor="start" class="">梯度更新</text>
<rect x="24" y="190" width="1232" height="430" rx="18" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="75" y="232" font-size="25" text-anchor="start" class="title">阶段 1 · Base policy：特权信息支持的 PPO 训练</text>
<rect x="50" y="270" width="220" height="100" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="160.0" y="312.2" font-size="22" text-anchor="middle" class="title">特权信息 e_t</text>
<text x="160.0" y="343.2" font-size="22" text-anchor="middle" class="">位置与属性：9 维</text>
<rect x="330" y="270" width="260" height="100" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="460.0" y="312.2" font-size="22" text-anchor="middle" class="title">物体编码器 μ</text>
<text x="460.0" y="343.2" font-size="22" text-anchor="middle" class="">9 → 256 → 128 → 8</text>
<rect x="650" y="270" width="170" height="100" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="735.0" y="312.2" font-size="22" text-anchor="middle" class="title">z_t</text>
<text x="735.0" y="343.2" font-size="22" text-anchor="middle" class="">8 维，可导</text>
<rect x="650" y="410" width="170" height="90" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="735.0" y="447.2" font-size="22" text-anchor="middle" class="title">短历史 o_t</text>
<text x="735.0" y="478.2" font-size="22" text-anchor="middle" class="">96 维</text>
<rect x="900" y="270" width="310" height="230" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1055.0" y="329.05" font-size="23" text-anchor="middle" class="title">控制网络</text>
<text x="1055.0" y="361.05" font-size="23" text-anchor="middle" class="">共享 MLP</text>
<text x="1055.0" y="393.05" font-size="23" text-anchor="middle" class="">输入：96 + 8</text>
<text x="1055.0" y="425.05" font-size="23" text-anchor="middle" class="">Actor π：动作分布</text>
<text x="1055.0" y="457.05" font-size="23" text-anchor="middle" class="">Critic V：状态价值</text>
<path d="M 270 320 L 330 320" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 590 320 L 650 320" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 820 320 L 900 320" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 820 455 L 850 455 L 850 385 L 900 385" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<rect x="50" y="430" width="540" height="110" rx="13" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="320.0" y="477.05" font-size="23" text-anchor="middle" class="title">仿真交互与 PPO 损失</text>
<text x="320.0" y="509.05" font-size="23" text-anchor="middle" class="">更新 μ、共享骨干、Actor 与 Critic</text>
<path d="M 460 430 L 460 370" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#grad)"/>
<path d="M 590 505 L 835 505 L 835 485 L 900 485" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#grad)"/>
<path d="M 1055 500 L 1055 575 L 320 575 L 320 540" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<text x="650" y="602" font-size="22" text-anchor="middle" class="muted">动作 → 仿真；奖励与轨迹 → PPO</text>
<rect x="24" y="650" width="1232" height="510" rx="18" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="75" y="692" font-size="25" text-anchor="start" class="title">阶段 2 · Adaptation：固定控制器，只训练历史估计器</text>
<rect x="50" y="740" width="180" height="100" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="140.0" y="782.2" font-size="22" text-anchor="middle" class="title">特权信息 e_t</text>
<text x="140.0" y="813.2" font-size="22" text-anchor="middle" class="">仅训练可得</text>
<rect x="290" y="740" width="220" height="100" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="400.0" y="781.9" font-size="24" text-anchor="middle" class="title">冻结 μ</text>
<text x="400.0" y="814.9" font-size="24" text-anchor="middle" class="">不更新权重</text>
<rect x="590" y="740" width="160" height="100" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="670.0" y="782.2" font-size="22" text-anchor="middle" class="title">标签 z_t</text>
<text x="670.0" y="813.2" font-size="22" text-anchor="middle" class="">stop-grad</text>
<rect x="850" y="740" width="350" height="100" rx="13" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="1025.0" y="781.9" font-size="24" text-anchor="middle" class="title">latent MSE</text>
<text x="1025.0" y="814.9" font-size="24" text-anchor="middle" class="">mean ‖ẑ_t − z_t‖²</text>
<rect x="50" y="920" width="180" height="100" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="140.0" y="962.2" font-size="22" text-anchor="middle" class="title">历史 H_t</text>
<text x="140.0" y="993.2" font-size="22" text-anchor="middle" class="">30 × 32</text>
<rect x="290" y="920" width="220" height="100" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="400.0" y="962.2" font-size="22" text-anchor="middle" class="title">适应模块 φ</text>
<text x="400.0" y="993.2" font-size="22" text-anchor="middle" class="">MLP + 时间卷积</text>
<rect x="590" y="920" width="160" height="100" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="670.0" y="962.2" font-size="22" text-anchor="middle" class="title">预测 ẑ_t</text>
<text x="670.0" y="993.2" font-size="22" text-anchor="middle" class="">8 维，可导</text>
<rect x="850" y="920" width="350" height="100" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1025.0" y="962.05" font-size="23" text-anchor="middle" class="title">冻结 π(o_t, ẑ_t)</text>
<text x="1025.0" y="994.05" font-size="23" text-anchor="middle" class="">在仿真中继续采集历史</text>
<path d="M 230 790 L 290 790" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 510 790 L 590 790" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 750 790 L 850 790" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 230 970 L 290 970" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 510 970 L 590 970" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 750 970 L 850 970" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 750 950 L 790 950 L 790 820 L 850 820" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 1200 790 L 1230 790 L 1230 1070 L 400 1070 L 400 1020" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#grad)"/>
<text x="75" y="1125" font-size="22" text-anchor="start" class="">MSE 仅更新 φ；策略执行产生新历史，但这里不对动作或环境做反向传播。</text>
<rect x="24" y="1190" width="1232" height="500" rx="18" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="75" y="1232" font-size="25" text-anchor="start" class="title">部署 · 固定全部权重，持续更新历史与 latent</text>
<rect x="50" y="1270" width="210" height="90" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="155.0" y="1307.2" font-size="22" text-anchor="middle" class="title">真实历史 H_t</text>
<text x="155.0" y="1338.2" font-size="22" text-anchor="middle" class="">关节＋历史目标</text>
<rect x="310" y="1270" width="240" height="90" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="430.0" y="1307.05" font-size="23" text-anchor="middle" class="title">固定权重的 φ</text>
<text x="430.0" y="1339.05" font-size="23" text-anchor="middle" class="">每步重新前向</text>
<rect x="610" y="1270" width="170" height="90" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="695.0" y="1307.2" font-size="22" text-anchor="middle" class="title">当前 ẑ_t</text>
<text x="695.0" y="1338.2" font-size="22" text-anchor="middle" class="">随历史变化</text>
<rect x="850" y="1270" width="350" height="145" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1025.0" y="1318.55" font-size="23" text-anchor="middle" class="title">固定权重的 Actor π</text>
<text x="1025.0" y="1350.55" font-size="23" text-anchor="middle" class="">输入：o_t 与 ẑ_t</text>
<text x="1025.0" y="1382.55" font-size="23" text-anchor="middle" class="">取动作均值</text>
<rect x="610" y="1380" width="170" height="80" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="695.0" y="1412.2" font-size="22" text-anchor="middle" class="title">短历史 o_t</text>
<text x="695.0" y="1443.2" font-size="22" text-anchor="middle" class="">仍每步更新</text>
<path d="M 260 1315 L 310 1315" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 550 1315 L 610 1315" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 780 1315 L 850 1315" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 780 1420 L 815 1420 L 815 1375 L 850 1375" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<rect x="850" y="1480" width="350" height="105" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1025.0" y="1524.55" font-size="23" text-anchor="middle" class="title">原始动作 a_t</text>
<text x="1025.0" y="1556.55" font-size="23" text-anchor="middle" class="">clamp 到 [−1, 1]</text>
<rect x="420" y="1480" width="360" height="105" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="600.0" y="1509.2" font-size="22" text-anchor="middle" class="title">累积位置目标 u_t</text>
<text x="600.0" y="1540.2" font-size="22" text-anchor="middle" class="">u_prev + a_clip / 24</text>
<text x="600.0" y="1571.2" font-size="22" text-anchor="middle" class="">再限制关节范围</text>
<rect x="50" y="1480" width="300" height="105" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="200.0" y="1524.7" font-size="22" text-anchor="middle" class="title">PD 控制器与真实手</text>
<text x="200.0" y="1555.7" font-size="22" text-anchor="middle" class="">位置目标 → 关节力矩</text>
<path d="M 1025 1415 L 1025 1480" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 850 1532 L 780 1532" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 420 1532 L 350 1532" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<text x="75" y="1640" font-size="22" text-anchor="start" class="">新的关节读数与已下发目标进入下一步历史；部署不需要 μ、Critic 或 PPO 更新。</text>
<text x="40" y="1738" font-size="22" text-anchor="start" class="">μ 是论文的物体编码器；π 是 Actor。原始动作 a_t 与累积 PD 位置目标 u_t 必须分开。</text>
</svg>
