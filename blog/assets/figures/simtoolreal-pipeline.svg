<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1170" viewBox="0 0 1400 1170" role="img" aria-labelledby="title desc">
<title id="title">SimToolReal：训练、视频处理与真机控制</title>
<desc id="desc">仿真通过随机工具与随机目标训练策略；人类视频在训练后提供工具模型和目标；真实执行使用位姿反馈闭环控制。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172033}.bold{font-weight:700}</style>
<rect width="1400" height="1170" fill="white"/>
<text x="40" y="55" font-size="32" text-anchor="start" class="bold">SimToolReal：训练、视频处理与真机控制</text>
<text x="40" y="96" font-size="21" text-anchor="start">按 v2 Fig. 2／3／12 重组；三行分别说明策略学习、任务准备和在线执行。</text>
<rect x="24" y="130" width="1352" height="260" rx="16" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="50" y="168" font-size="25" text-anchor="start" class="bold">① 仿真 RL：学习一个跨工具的目标控制器</text>
<rect x="55" y="210" width="290" height="115" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="200.0" y="259.2" font-size="22" text-anchor="middle" class="bold">程序生成工具</text>
<text x="200.0" y="291.2" font-size="22" text-anchor="middle">柄＋头；几何与密度变化</text>
<rect x="395" y="210" width="260" height="115" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="525.0" y="259.2" font-size="22" text-anchor="middle" class="bold">随机目标与交互</text>
<text x="525.0" y="291.2" font-size="22" text-anchor="middle">状态 → 动作 → reward</text>
<rect x="710" y="210" width="280" height="115" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="850.0" y="259.35" font-size="21" text-anchor="middle" class="bold">SAPG 训练</text>
<text x="850.0" y="290.35" font-size="21" text-anchor="middle">LSTM Actor＋特权 Critic</text>
<rect x="1045" y="210" width="300" height="115" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1195.0" y="259.2" font-size="22" text-anchor="middle" class="bold">通用 Actor 权重</text>
<text x="1195.0" y="291.2" font-size="22" text-anchor="middle">部署时固定</text>
<path d="M345 267 L395 267" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M655 267 L710 267" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M990 267 L1045 267" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="55" y="365" font-size="21" text-anchor="start">这一步使用仿真数值状态；测试工具视频不提供 Actor 的动作训练标签。</text>
<rect x="24" y="415" width="1352" height="280" rx="16" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="50" y="453" font-size="25" text-anchor="start" class="bold">② 新任务准备：人类 RGB-D 视频提供物体轨迹</text>
<rect x="55" y="500" width="270" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="190.0" y="536.35" font-size="21" text-anchor="middle" class="bold">RGB-D＋用户点提示</text>
<text x="190.0" y="567.35" font-size="21" text-anchor="middle">SAM 2／SAM 3D</text>
<text x="190.0" y="598.35" font-size="21" text-anchor="middle">米制几何与部件分割</text>
<rect x="380" y="500" width="300" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="530.0" y="536.35" font-size="21" text-anchor="middle" class="bold">工具 mesh＋抓握区域</text>
<text x="530.0" y="567.35" font-size="21" text-anchor="middle">原点在柄；+x 指向头</text>
<text x="530.0" y="598.35" font-size="21" text-anchor="middle">与训练坐标约定一致</text>
<rect x="735" y="500" width="260" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="865.0" y="551.7" font-size="22" text-anchor="middle" class="bold">FoundationPose</text>
<text x="865.0" y="583.7" font-size="22" text-anchor="middle">提取物体位姿轨迹</text>
<rect x="1050" y="500" width="295" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1197.5" y="536.35" font-size="21" text-anchor="middle" class="bold">目标序列 g¹…gᴷ</text>
<text x="1197.5" y="567.35" font-size="21" text-anchor="middle">30 → 3 Hz</text>
<text x="1197.5" y="598.35" font-size="21" text-anchor="middle">裁掉桌面静止前缀</text>
<path d="M325 560 L380 560" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M680 560 L735 560" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M995 560 L1050 560" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="55" y="665" font-size="21" text-anchor="start">预处理得到任务条件；mesh 服务于跟踪，粗抓握几何服务于策略观测。</text>
<rect x="24" y="720" width="1352" height="415" rx="16" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="50" y="758" font-size="25" text-anchor="start" class="bold">③ 在线执行：追踪当前目标，达到后再推进</text>
<rect x="55" y="810" width="290" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="200.0" y="846.35" font-size="21" text-anchor="middle" class="bold">本体感知＋视觉跟踪</text>
<text x="200.0" y="877.35" font-size="21" text-anchor="middle">工具 pose：30 Hz</text>
<text x="200.0" y="908.35" font-size="21" text-anchor="middle">抓握框与当前目标 gᵏ</text>
<rect x="405" y="810" width="270" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="540.0" y="846.35" font-size="21" text-anchor="middle" class="bold">固定 LSTM Actor</text>
<text x="540.0" y="877.35" font-size="21" text-anchor="middle">60 Hz 前向控制</text>
<text x="540.0" y="908.35" font-size="21" text-anchor="middle">递归状态持续更新</text>
<rect x="735" y="810" width="260" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="865.0" y="846.35" font-size="21" text-anchor="middle" class="bold">29 维关节位置目标</text>
<text x="865.0" y="877.35" font-size="21" text-anchor="middle">7 维手臂增量</text>
<text x="865.0" y="908.35" font-size="21" text-anchor="middle">22 维手绝对目标</text>
<rect x="1055" y="810" width="290" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1200.0" y="861.85" font-size="21" text-anchor="middle" class="bold">真实机器人＋工具</text>
<text x="1200.0" y="892.85" font-size="21" text-anchor="middle">运动产生新的观测</text>
<path d="M345 870 L405 870" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M675 870 L735 870" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M995 870 L1055 870" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1200 930 L1200 985 L200 985 L200 930" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="700" y="978" font-size="21" text-anchor="middle">闭环反馈</text>
<rect x="405" y="1020" width="590" height="75" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="700.0" y="1064.5" font-size="20" text-anchor="middle" class="bold">当前目标达到阈值 → k 加一；不按视频时钟强制跳转</text>
</svg>