<text x="60" y="1624" font-size="22" text-anchor="start" class="bold">DAgger 的关键是访问状态与标签采集方式；动作 MSE 本身并不等于 DAgger。</text>
<text x="60" y="1662" font-size="21" text-anchor="start" class="">E / S 分别表示 Teacher / Student；图中 θˢ 包含 Student 的感知编码与动作网络参数。</text>
<text x="60" y="1700" font-size="21" text-anchor="start" class="">g 是共享任务条件；目标特征的构造是否读取真值位姿，仍需检查代码的数据来源。</text>
<text x="40" y="1775" font-size="21" text-anchor="start" class="">SC 为固定坐标变换；橙色更新仅作用于神经网络参数。图中省略批次与回合终止细节。</text>
