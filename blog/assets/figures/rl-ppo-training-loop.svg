<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2090" viewBox="0 0 1280 2090" role="img" aria-labelledby="title desc">
<title id="title">PPO：采样 → 构造固定目标 → 重新前向与更新</title>
<desc id="desc">PPO三个阶段。先固定参数采集轨迹和旧策略概率及旧价值，再用奖励与旧价值计算GAE和固定return目标。更新时重新编码旧观测，计算旧动作的新概率和新的价值预测。策略损失及价值损失反向更新模型。固定数据不接收梯度。</desc>
<defs>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="fixed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
</defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172033} .title{font-weight:750} .muted{fill:#475569}</style>
<rect width="1280" height="2090" fill="#ffffff"/>
<text x="40" y="57" font-size="32" text-anchor="start" class="title">PPO：采样 → 构造固定目标 → 重新前向与更新</text>
<text x="40" y="99" font-size="22" text-anchor="start" class="muted">实线传递数据；橙色虚线更新参数。old 指采样快照，new 指正在更新的网络。</text>
<rect x="40" y="126" width="25" height="25" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="76" y="147" font-size="22" text-anchor="start" class="">网络／可导计算</text>
<rect x="260" y="126" width="25" height="25" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="296" y="147" font-size="22" text-anchor="start" class="">固定数据／冻结模块</text>
<rect x="585" y="126" width="25" height="25" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="621" y="147" font-size="22" text-anchor="start" class="">物理环境</text>
<rect x="795" y="126" width="25" height="25" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="831" y="147" font-size="22" text-anchor="start" class="">损失／改动</text>
<path d="M 1020 135 L 1070 135" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#grad)"/>
<text x="1083" y="143" font-size="22" text-anchor="start" class="">梯度更新</text>
<rect x="24" y="190" width="1232" height="365" rx="18" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="75" y="232" font-size="25" text-anchor="start" class="title">① A · 采样：参数暂时不变，不构建梯度图</text>
<rect x="60" y="270" width="350" height="120" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="235.0" y="305.4" font-size="24" text-anchor="middle" class="title">行为策略与价值网络</text>
<text x="235.0" y="338.4" font-size="24" text-anchor="middle" class="">π_old、V_old</text>
<text x="235.0" y="371.4" font-size="24" text-anchor="middle" class="">输入原始 x_t</text>
<rect x="475" y="275" width="280" height="110" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="615.0" y="321.9" font-size="24" text-anchor="middle" class="title">采样动作 a_t</text>
<text x="615.0" y="354.9" font-size="24" text-anchor="middle" class="">计算 old_logp</text>
<rect x="860" y="270" width="350" height="120" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1035.0" y="305.4" font-size="24" text-anchor="middle" class="title">物理／仿真环境</text>
<text x="1035.0" y="338.4" font-size="24" text-anchor="middle" class="">执行动作，产生后果</text>
<text x="1035.0" y="371.4" font-size="24" text-anchor="middle" class="">不通过环境反向传播</text>
<path d="M 410 330 L 475 330" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 755 330 L 860 330" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<rect x="60" y="440" width="1150" height="80" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="635.0" y="487.7" font-size="22" text-anchor="middle" class="title">轨迹缓存：原始 x、动作 a、奖励 r、old_logp、old_V、next_V、终止／截断标记</text>
<path d="M 235 390 L 235 440" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 615 385 L 615 440" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 1035 390 L 1035 440" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<rect x="24" y="585" width="1232" height="400" rx="18" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="75" y="627" font-size="25" text-anchor="start" class="title">② B · 计算训练信号：全部 stop-gradient</text>
<rect x="100" y="660" width="1080" height="95" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="640.0" y="699.4" font-size="24" text-anchor="middle" class="title">GAE：δ_t = r_t + γ b_t V_old,next − V_old,t</text>
<text x="640.0" y="732.4" font-size="24" text-anchor="middle" class="">Â_t = δ_t + γ λ c_t Â_(t+1)</text>
<path d="M 635 520 L 635 660" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<rect x="100" y="815" width="440" height="95" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="320.0" y="854.4" font-size="24" text-anchor="middle" class="title">优势估计 Â_t</text>
<text x="320.0" y="887.4" font-size="24" text-anchor="middle" class="">Actor 的固定样本权重</text>
<rect x="740" y="815" width="440" height="95" rx="13" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="960.0" y="854.55" font-size="23" text-anchor="middle" class="title">回报目标 R̂_t = Â_t + V_old,t</text>
<text x="960.0" y="886.55" font-size="23" text-anchor="middle" class="">Critic 的固定回归标签</text>
<path d="M 420 755 L 420 785 L 320 785 L 320 815" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 860 755 L 860 785 L 960 785 L 960 815" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<text x="100" y="955" font-size="22" text-anchor="start" class="">b_t：是否允许 bootstrap；c_t：是否属于同一段连续轨迹。两者在外部截断时不同。</text>
<rect x="24" y="1020" width="1232" height="950" rx="18" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="2"/>
<text x="75" y="1062" font-size="25" text-anchor="start" class="title">③ C · 更新：同一批旧经历，多轮重新前向计算</text>
<rect x="300" y="1110" width="680" height="115" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="640.0" y="1143.55" font-size="23" text-anchor="middle" class="title">当前网络读取缓存里的原始 x</text>
<text x="640.0" y="1175.55" font-size="23" text-anchor="middle" class="">重新经过 Encoder、共享骨干、Actor 与 Critic</text>
<text x="640.0" y="1207.55" font-size="23" text-anchor="middle" class="">此处建立计算图</text>
<rect x="100" y="1290" width="440" height="100" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="1332.05" font-size="23" text-anchor="middle" class="title">new_logp = log π_θ(a_t | x_t)</text>
<text x="320.0" y="1364.05" font-size="23" text-anchor="middle" class="">评价旧动作，不重新采样</text>
<rect x="740" y="1290" width="440" height="100" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="960.0" y="1332.05" font-size="23" text-anchor="middle" class="title">V_new = V_ψ(x_t)</text>
<text x="960.0" y="1364.05" font-size="23" text-anchor="middle" class="">当前网络对旧输入的新预测</text>
<path d="M 500 1225 L 500 1260 L 320 1260 L 320 1290" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 780 1225 L 780 1260 L 960 1260 L 960 1290" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<rect x="100" y="1475" width="440" height="170" rx="13" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="320.0" y="1521.2" font-size="22" text-anchor="middle" class="title">Actor loss：PPO-Clip</text>
<text x="320.0" y="1552.2" font-size="22" text-anchor="middle" class="">ρ = exp(new_logp − old_logp)</text>
<text x="320.0" y="1583.2" font-size="22" text-anchor="middle" class="">−mean min(ρÂ, clip(ρ)Â)</text>
<text x="320.0" y="1614.2" font-size="22" text-anchor="middle" class="">Â、old_logp 固定，new 可导</text>
<rect x="740" y="1475" width="440" height="170" rx="13" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="960.0" y="1521.2" font-size="22" text-anchor="middle" class="title">Critic loss：回归</text>
<text x="960.0" y="1552.2" font-size="22" text-anchor="middle" class="">mean (V_new − R̂)²</text>
<text x="960.0" y="1583.2" font-size="22" text-anchor="middle" class="">拟合这批经历给出的目标</text>
<text x="960.0" y="1614.2" font-size="22" text-anchor="middle" class="">R̂ 固定，只有 V_new 可导</text>
<path d="M 320 1390 L 320 1475" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 960 1390 L 960 1475" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 100 860 L 45 860 L 45 1555 L 100 1555" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fixed)"/>
<path d="M 1180 860 L 1235 860 L 1235 1555 L 1180 1555" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#fixed)"/>
<rect x="350" y="1715" width="580" height="95" rx="13" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="640.0" y="1754.7" font-size="22" text-anchor="middle" class="title">总损失</text>
<text x="640.0" y="1785.7" font-size="22" text-anchor="middle" class="">L = L_actor + c_V L_value − c_H entropy</text>
<path d="M 320 1645 L 320 1762 L 350 1762" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<path d="M 960 1645 L 960 1762 L 930 1762" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#data)"/>
<rect x="300" y="1870" width="680" height="75" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="640.0" y="1915.55" font-size="23" text-anchor="middle" class="title">梯度更新：Encoder、共享骨干、Actor、Critic</text>
<path d="M 640 1810 L 640 1870" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#grad)"/>
<text x="40" y="2020" font-size="22" text-anchor="start" class="">下一轮重新采样：当前网络成为新的行为策略；固定目标不是跨所有迭代永远不变。</text>
<text x="40" y="2057" font-size="22" text-anchor="start" class="">γ：奖励折扣；λ：GAE 系数；ρ：新旧密度比；c_V、c_H：损失权重；符号和边界处理见正文。</text>
</svg>
